name: Build Novel Companion Vivi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          test -f NovelCompanion_Vivi_Android.zip
          echo "ZIP ditemukan."

      - name: Extract Android project
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -q NovelCompanion_Vivi_Android.zip -d build_project
          echo "Project berhasil diekstrak."
          ls -la build_project
          ls -la build_project/app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: build_project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelCompanion-Vivi-APK
          path: build_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
